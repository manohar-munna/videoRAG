# VideoRAG Configuration
# ----------------------
# All paths can be absolute or relative to the project root.

data:
  # Path to the real CCTV JSON dataset
  data_path: "data/real_cctv_events.json"

indexing:
  # Sentence-Transformers multimodal CLIP model for embedding
  model_name: "clip-ViT-B-32"
  # Sliding-window chunk size (number of documents per window)
  chunk_size: 3
  # Number of overlapping documents between consecutive windows
  overlap: 1
  # Base path for saved FAISS index files (extensions added automatically)
  index_save_path: "index/cctv_index"

retrieval:
  # Number of results to retrieve before reranking
  top_k: 10
  # Whether to apply cross-encoder reranking after vector retrieval
  use_reranker: true
  # Number of results to keep after reranking
  rerank_top_k: 5

llm:
  # Backend to use: 'local' | 'gemini' | 'openai' | 'mock'
  backend: "local"
  # Model name or GGUF path
  model: "Local LLM 3VL 4Q/Qwen3VL-4B-Instruct-Q4_K_M.gguf"
  # Base URL for local llama-server / OpenAI-compatible endpoint
  base_url: "http://127.0.0.1:8080/v1"
  # Optional: API key
  api_key: "local"

evaluation:
  # Set to false to skip evaluation output during query runs
  enabled: true
